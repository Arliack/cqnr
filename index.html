document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

x&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Texte Signes (les 3)&quot;},\n  &quot;cercle1X&quot;: {&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:-8,&quot;min&quot;:-120,&quot;max&quot;:120,&quot;step&quot;:1,&quot;unit&quot;:&quot;px&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Cercle 1 (haut)&quot;},\n  &quot;cercle1Y&quot;: {&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:3,&quot;min&quot;:-120,&quot;max&quot;:120,&quot;step&quot;:1,&quot;unit&quot;:&quot;px&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Cercle 1 (haut)&quot;},\n  &quot;cercle2X&quot;: {&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:-9,&quot;min&quot;:-120,&quot;max&quot;:120,&quot;step&quot;:1,&quot;unit&quot;:&quot;px&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Cercle 2 (milieu)&quot;},\n  &quot;cercle2Y&quot;: {&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:-14,&quot;min&quot;:-120,&quot;max&quot;:120,&quot;step&quot;:1,&quot;unit&quot;:&quot;px&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Cercle 2 (milieu)&quot;},\n  &quot;cercle3X&quot;: {&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:0,&quot;min&quot;:-120,&quot;max&quot;:120,&quot;step&quot;:1,&quot;unit&quot;:&quot;px&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Cercle 3 (bas)&quot;},\n  &quot;cercle3Y&quot;: {&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:-2,&quot;min&quot;:-120,&quot;max&quot;:120,&quot;step&quot;:1,&quot;unit&quot;:&quot;px&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Cercle 3 (bas)&quot;},\n  &quot;cercleRayon&quot;: {&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:140,&quot;min&quot;:90,&quot;max&quot;:210,&quot;step&quot;:1,&quot;unit&quot;:&quot;px&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Rayon cercles&quot;}\n}\">\nclass Component extends DCLogic {\n  state = {\n    lang: 'fr',\n    f: { joueur:'', campagne:'', nom:'', concept:'', eclat1:'', eclat2:'', eclat3:'', marque:'', signe1:'', signe2:'', signe3:'' },\n    portraitUrl: null, iw: 0, ih: 0, ox: 0, oy: 0, zoom: 1,\n    colors: { vert: '#9bce64', jaune: '#e6d76c', rouge: '#984534' },\n    showPreview: false, previewUrl: null, generating: false\n  };\n\n  VW = 240; VH = 353;\n\n  // zones : rectangles exacts en fractions de la feuille 3508x2480.\n  // portrait = placement exact du carré bleu mesuré dans le PDF de référence (CQNR-.pdf)\n  ZONES = {\n    portrait: { x:.02694, y:.28571, w:.21212, h:.44095 },\n    joueur:   { x:.0314, y:.1633, x2:.2737, y2:.2081, size:72 },\n    campagne: { x:.0314, y:.2310, x2:.2737, y2:.2742, size:72 },\n    nom:      { x:.0299, y:.7319, x2:.2382, y2:.7895, size:105 },\n    concept:  { x:.3007, y:.6339, x2:.6300, y2:.6621, size:55 },\n    eclat1:   { x:.2833, y:.6831, x2:.9832, y2:.7347, size:80 },\n    eclat2:   { x:.2833, y:.7544, x2:.9832, y2:.8069, size:80 },\n    eclat3:   { x:.2833, y:.8262, x2:.9832, y2:.8798, size:80 },\n    marque:   { x:.2833, y:.9145, x2:.9832, y2:.9690, size:80 },\n    signe1:   { x:.0328, y:.8407, x2:.2486, y2:.8718, size:56 },\n    signe2:   { x:.0328, y:.8867, x2:.2486, y2:.9169, size:56 },\n    signe3:   { x:.0328, y:.9323, x2:.2486, y2:.9633, size:56 }\n  };\n\n  // dessine un texte centré (H+V) dans son rectangle, sans jamais déborder :\n  // réduction de taille, puis passage sur 2 lignes équilibrées si la phrase est trop longue\n  drawZoneText(ctx, text, r, W, H, dx, dy) {\n    const x1 = r.x * W + (dx || 0), x2 = r.x2 * W + (dx || 0), y1 = r.y * H + (dy || 0), y2 = r.y2 * H + (dy || 0);\n    const pad = 16, bw = x2 - x1 - 2 * pad, bh = y2 - y1;\n    const cx = (x1 + x2) / 2;\n    let cy = (y1 + y2) / 2;\n    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';\n    const setF = (s) => { ctx.font = `400 ${s}px Kalam`; };\n    const wOf = (t) => ctx.measureText(t).width;\n    const maxS = Math.min(r.size, Math.floor(bh * 0.74));\n    // 1) une seule ligne, taille réduite si besoin\n    let s1 = maxS; setF(s1);\n    const floor1 = Math.max(24, Math.round(maxS * 0.55));\n    while (s1 > floor1 && wOf(text) > bw) { s1 -= 2; setF(s1); }\n    if (wOf(text) <= bw) { ctx.fillText(text, cx, cy + s1 * 0.06); return; }\n    // 2) deux lignes équilibrées maximum, police réduite\n    const words = text.split(/\\s+/);\n    if (words.length > 1) {\n      let best = null;\n      setF(100);\n      for (let i = 1; i < words.length; i++) {\n        const a = words.slice(0, i).join(' '), b = words.slice(i).join(' ');\n        const m = Math.max(wOf(a), wOf(b));\n        if (!best || m < best.m) best = { a, b, m };\n      }\n      let s2 = Math.min(maxS, Math.floor(bh * 0.42)); setF(s2);\n      while (s2 > 16 && (wOf(best.a) > bw || wOf(best.b) > bw)) { s2 -= 2; setF(s2); }\n      if (wOf(best.a) <= bw && wOf(best.b) <= bw) {\n        ctx.fillText(best.a, cx, cy + s2 * 0.06 - s2 * 0.58);\n        ctx.fillText(best.b, cx, cy + s2 * 0.06 + s2 * 0.58);\n        return;\n      }\n    }\n    // 3) dernier recours : réduire jusqu'à tenir\n    let s3 = s1; setF(s3);\n    while (s3 > 14 && wOf(text) > bw) { s3 -= 1; setF(s3); }\n    ctx.fillText(text, cx, cy + s3 * 0.06);\n  }\n\n  DICT = {\n    fr: {\n      subtitle:'Feuille de personnage', joueur:'Joueur·se', joueurPh:'Votre nom',\n      campagne:'Campagne', campagnePh:'Nom de la campagne', nom:'Nom du personnage', nomPh:'Son nom',\n      concept:'Concept', conceptPh:'Ex. chevalière fatiguée qui espère encore', conceptHelp:'En une phrase : qui est ce personnage ?',\n      portrait:'Portrait', choosePhoto:'Choisir une photo', portraitHelp:'Facultatif. Vous pourrez la recadrer.',\n      remove:'Retirer', cropHelp:'Déplacez l\\u2019image avec le doigt, zoomez avec le curseur.',\n      eclats:'Éclats', eclat:'Éclat', eclatsHelp:'Trois souvenirs lumineux qui font tenir votre personnage.',\n      marque:'Marque', marquePh:'Sa marque', marqueHelp:'La blessure ou le poids que votre personnage porte.',\n      signes:'Signes', signe:'Signe', signesHelp:'Trois détails visibles : apparence, gestes, manières.',\n      couleurs:'Couleurs de la feuille', couleursHelp:'Les trois teintes de la feuille PDF. Chaque choix recolore toutes les zones de cette couleur.',\n      cVert:'Vert', cJaune:'Jaune', cRouge:'Rouge',\n      generate:'Générer la feuille PDF', generating:'Préparation…', autosave:'Vos réponses sont enregistrées automatiquement',\n      previewTitle:'Votre feuille de personnage', back:'Modifier', download:'Télécharger le PDF'\n    },\n    en: {\n      subtitle:'Character sheet', joueur:'Player', joueurPh:'Your name',\n      campagne:'Campaign', campagnePh:'Campaign name', nom:'Character name', nomPh:'Their name',\n      concept:'Concept', conceptPh:'E.g. weary knight who still hopes', conceptHelp:'In one sentence: who is this character?',\n      portrait:'Portrait', choosePhoto:'Choose a photo', portraitHelp:'Optional. You can crop it after.',\n      remove:'Remove', cropHelp:'Drag the image with your finger, zoom with the slider.',\n      eclats:'Éclats', eclat:'Éclat', eclatsHelp:'Three bright memories that keep your character going.',\n      marque:'Marque', marquePh:'Their mark', marqueHelp:'The wound or burden your character carries.',\n      signes:'Signes', signe:'Signe', signesHelp:'Three visible details: looks, gestures, manners.',\n      couleurs:'Sheet colors', couleursHelp:'The three tints of the PDF sheet. Each choice recolors every zone of that color.',\n      cVert:'Green', cJaune:'Yellow', cRouge:'Red',\n      generate:'Generate sheet PDF', generating:'Preparing…', autosave:'Your answers are saved automatically',\n      previewTitle:'Your character sheet', back:'Edit', download:'Download PDF'\n    }\n  };\n\n  componentDidMount() {\n    try {\n      const raw = localStorage.getItem('cqnr-character');\n      if (raw) {\n        const d = JSON.parse(raw);\n        this.setState({\n          lang: d.lang || 'fr',\n          f: Object.assign({}, this.state.f, d.f || {}),\n          portraitUrl: d.portraitUrl || null, iw: d.iw||0, ih: d.ih||0,\n          ox: d.ox||0, oy: d.oy||0, zoom: d.zoom||1,\n          colors: (() => { const c = Object.assign({}, this.state.colors); for (const k of ['vert','jaune','rouge']) if (d.colors && d.colors[k]) c[k] = d.colors[k]; return c; })()\n        });\n      }\n    } catch (e) {}\n  }\n\n  save() {\n    const { lang, f, portraitUrl, iw, ih, ox, oy, zoom, colors } = this.state;\n    try { localStorage.setItem('cqnr-character', JSON.stringify({ lang, f, portraitUrl, iw, ih, ox, oy, zoom, colors })); } catch (e) {}\n  }\n\n  // ---- couleurs ----\n  hexToHsl(hex) {\n    const n = parseInt(hex.slice(1), 16);\n    const r = ((n >> 16) & 255) / 255, g = ((n >> 8) & 255) / 255, b = (n & 255) / 255;\n    const mx = Math.max(r, g, b), mn = Math.min(r, g, b);\n    const l = (mx + mn) / 2;\n    if (mx === mn) return [0, 0, l];\n    const d = mx - mn;\n    const s = l > 0.5 ? d / (2 - mx - mn) : d / (mx + mn);\n    let h;\n    if (mx === r) h = ((g - b) / d + (g < b ? 6 : 0)); else if (mx === g) h = (b - r) / d + 2; else h = (r - g) / d + 4;\n    return [h * 60, s, l];\n  }\n  hslToRgb(h, s, l) {\n    const c = (1 - Math.abs(2 * l - 1)) * s;\n    const x = c * (1 - Math.abs(((h / 60) % 2) - 1));\n    const m = l - c / 2;\n    let r, g, b;\n    if (h < 60) [r, g, b] = [c, x, 0]; else if (h < 120) [r, g, b] = [x, c, 0];\n    else if (h < 180) [r, g, b] = [0, c, x]; else if (h < 240) [r, g, b] = [0, x, c];\n    else if (h < 300) [r, g, b] = [x, 0, c]; else [r, g, b] = [c, 0, x];\n    return [Math.round((r + m) * 255), Math.round((g + m) * 255), Math.round((b + m) * 255)];\n  }\n\n  getRecoloredSheet(sheet) {\n    const col = this.state.colors;\n    const key = JSON.stringify(col);\n    if (this._rcKey === key && this._rcCv) return this._rcCv;\n    const W = sheet.naturalWidth, H = sheet.naturalHeight;\n    const cv = document.createElement('canvas'); cv.width = W; cv.height = H;\n    const ctx = cv.getContext('2d');\n    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, W, H);\n    ctx.drawImage(sheet, 0, 0);\n    // la teinte choisie est appliquée EXACTEMENT sur l'encre de base ;\n    // les nuances (ombres, anticrénelage) gardent leur écart de luminosité\n    const tV = this.hexToHsl(col.vert), tR = this.hexToHsl(col.rouge), tJ = this.hexToHsl(col.jaune);\n    const BASE_L = { vert: 0.47, rouge: 0.41, gris: 0.686 };\n    const clampL = (l) => Math.min(0.97, Math.max(0.04, l));\n    const im = ctx.getImageData(0, 0, W, H);\n    const d = im.data;\n    for (let i = 0; i < d.length; i += 4) {\n      const r = d[i], g = d[i + 1], b = d[i + 2];\n      const mx = Math.max(r, g, b), mn = Math.min(r, g, b);\n      const L = (mx + mn) / 510;\n      if (mx - mn >= 30) {\n        const dd = mx - mn;\n        let h;\n        if (mx === r) h = ((g - b) / dd + 6) % 6; else if (mx === g) h = (b - r) / dd + 2; else h = (r - g) / dd + 4;\n        h = (h * 60) % 360;\n        let t = null, bl = 0;\n        if (h >= 60 && h <= 180) { t = tV; bl = BASE_L.vert; }\n        else if (h <= 45 || h >= 330) { t = tR; bl = BASE_L.rouge; }\n        if (t) {\n          const rgb = this.hslToRgb(t[0], t[1], clampL(t[2] + (L - bl)));\n          d[i] = rgb[0]; d[i + 1] = rgb[1]; d[i + 2] = rgb[2];\n        }\n      } else if (mx > 110 && mx < 246) {\n        const rgb = this.hslToRgb(tJ[0], tJ[1], clampL(tJ[2] + (L - BASE_L.gris)));\n        d[i] = rgb[0]; d[i + 1] = rgb[1]; d[i + 2] = rgb[2];\n      }\n    }\n    ctx.putImageData(im, 0, 0);\n    this._rcKey = key; this._rcCv = cv;\n    return cv;\n  }\n\n  set(patch) { this.setState(patch, () => this.save()); }\n\n  pickColor(name, value) {\n    this.set({ colors: Object.assign({}, this.state.colors, { [name]: value }) });\n  }\n\n  // ---- crop helpers ----\n  coverScale() {\n    const { iw, ih } = this.state;\n    if (!iw || !ih) return 1;\n    return Math.max(this.VW / iw, this.VH / ih);\n  }\n  clampOffsets(ox, oy, zoom) {\n    const s = this.coverScale() * zoom;\n    const w = this.state.iw * s, h = this.state.ih * s;\n    const mx = Math.max(0, (w - this.VW) / 2), my = Math.max(0, (h - this.VH) / 2);\n    return [Math.min(mx, Math.max(-mx, ox)), Math.min(my, Math.max(-my, oy))];\n  }\n\n  // ---- canvas composition ----\n  async buildCanvas() {\n    const load = (src) => new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = src; });\n    await document.fonts.load('700 60px Kalam');\n    await document.fonts.load('400 60px Kalam');\n    const sheetSrc = (window.__resources && window.__resources['assets/feuille-cqnr.png']) || 'assets/feuille-cqnr.png';\n    const sheetImg = await load(sheetSrc);\n    const sheet = this.getRecoloredSheet(sheetImg);\n    const W = sheet.width, H = sheet.height;\n    const cv = document.createElement('canvas'); cv.width = W; cv.height = H;\n    const ctx = cv.getContext('2d');\n    ctx.drawImage(sheet, 0, 0);\n\n    // portrait : rogné exactement à la zone, dessiné SOUS le carré bleu\n    const { portraitUrl, f } = this.state;\n    const z = this.ZONES.portrait;\n    const bx = z.x * W, by = z.y * H, bw = z.w * W, bh = z.h * H;\n    if (portraitUrl) {\n      const img = await load(portraitUrl);\n      const k = bw / this.VW;\n      const s = this.coverScale() * this.state.zoom * k;\n      const dw = img.naturalWidth * s, dh = img.naturalHeight * s;\n      const dx = bx + bw / 2 - dw / 2 + this.state.ox * k;\n      const dy = by + bh / 2 - dh / 2 + this.state.oy * k;\n      ctx.save(); ctx.beginPath(); ctx.rect(bx, by, bw, bh); ctx.clip();\n      ctx.drawImage(img, dx, dy, dw, dh); ctx.restore();\n    }\n    // le carré bleu (cadre du portrait) est redessiné PAR-DESSUS la photo\n    {\n      const m = Math.round(W * 0.010);\n      const rx = Math.max(0, Math.round(bx - m)), ry = Math.max(0, Math.round(by - m));\n      const rw = Math.min(W - rx, Math.round(bw + 2 * m)), rh = Math.min(H - ry, Math.round(bh + 2 * m));\n      const fc = document.createElement('canvas'); fc.width = rw; fc.height = rh;\n      const fx = fc.getContext('2d');\n      fx.fillStyle = '#ffffff'; fx.fillRect(0, 0, rw, rh);\n      fx.drawImage(sheetImg, rx, ry, rw, rh, 0, 0, rw, rh);\n      const fim = fx.getImageData(0, 0, rw, rh), fd = fim.data;\n      for (let i = 0; i < fd.length; i += 4) {\n        const mx = Math.max(fd[i], fd[i + 1], fd[i + 2]);\n        fd[i] = 20; fd[i + 1] = 20; fd[i + 2] = 20;\n        fd[i + 3] = 255 - mx;\n      }\n      fx.putImageData(fim, 0, 0);\n      ctx.drawImage(fc, rx, ry);\n    }\n    // cercles chevrons opaques par-dessus\n    ctx.save(); ctx.beginPath();\n    {\n      const p = this.props;\n      const offs = [[p.cercle1X ?? -8, p.cercle1Y ?? 3], [p.cercle2X ?? -9, p.cercle2Y ?? -14], [p.cercle3X ?? 0, p.cercle3Y ?? -2]];\n      const base = [[.2634, .3395], [.2634, .4629], [.2614, .5730]];\n      const r = (p.cercleRayon ?? 140);\n      for (let ci = 0; ci < 3; ci++) {\n        const ccx = base[ci][0] * W + offs[ci][0], ccy = base[ci][1] * H + offs[ci][1];\n        ctx.moveTo(ccx + r, ccy);\n        ctx.arc(ccx, ccy, r, 0, Math.PI * 2);\n      }\n    }\n    ctx.clip(); ctx.drawImage(sheet, 0, 0); ctx.restore();\n\n    // textes : centrés dans leur rectangle dédié\n    ctx.fillStyle = '#1e1c18';\n    for (const key of Object.keys(this.ZONES)) {\n      if (key === 'portrait') continue;\n      const text = (f[key] || '').trim();\n      if (!text) continue;\n      const grp = key.startsWith('eclat') ? 'eclats' : key.startsWith('signe') ? 'signes' : key;\n      const p = this.props;\n      const TXTDEF = { joueur: [0, 12], campagne: [0, 4], nom: [0, 14], concept: [0, 0], eclats: [0, 16], marque: [0, 8], signes: [0, 6] };\n      this.drawZoneText(ctx, text, this.ZONES[key], W, H, p['txt_' + grp + 'X'] ?? TXTDEF[grp][0], p['txt_' + grp + 'Y'] ?? TXTDEF[grp][1]);\n    }\n    return cv;\n  }\n\n  async generate() {\n    if (this.state.generating) return;\n    this.setState({ generating: true });\n    try {\n      const cv = await this.buildCanvas();\n      const url = cv.toDataURL('image/jpeg', 0.88);\n      this.setState({ previewUrl: url, showPreview: true, generating: false });\n    } catch (e) {\n      console.error(e);\n      this.setState({ generating: false });\n    }\n  }\n\n  renderVals() {\n    const s = this.state;\n    const L = this.DICT[s.lang];\n    const vert = s.colors.vert;\n    const rouge = s.colors.rouge;\n    // jaune d'interface : assombri pour rester lisible\n    const jh = this.hexToHsl(s.colors.jaune);\n    const jRgb = this.hslToRgb(jh[0], jh[1], Math.min(jh[2], 0.45));\n    const jaune = `rgb(${jRgb[0]},${jRgb[1]},${jRgb[2]})`;\n    const mkSwatches = (name, list) => list.map((color) => ({\n      color,\n      border: s.colors[name] === color ? '3px solid #2b2b2b' : '1px solid #d5d0c4',\n      pick: () => this.pickColor(name, color)\n    }));\n    const cover = this.coverScale();\n    const dispScale = cover * s.zoom;\n    const w = s.iw * dispScale, h = s.ih * dispScale;\n\n    return {\n      L, f: s.f, zoom: s.zoom,\n      colorVert: vert, colorJaune: jaune, colorRouge: rouge,\n      frBg: s.lang === 'fr' ? '#2b2b2b' : 'transparent', frFg: s.lang === 'fr' ? '#fff' : '#8a8478',\n      enBg: s.lang === 'en' ? '#2b2b2b' : 'transparent', enFg: s.lang === 'en' ? '#fff' : '#8a8478',\n      setFR: () => this.set({ lang: 'fr' }),\n      setEN: () => this.set({ lang: 'en' }),\n      onField: (e) => {\n        const f = Object.assign({}, this.state.f, { [e.target.name]: e.target.value });\n        this.set({ f });\n      },\n      hasPortrait: !!s.portraitUrl,\n      noPortrait: !s.portraitUrl,\n      portraitUrl: s.portraitUrl,\n      cropImgStyle: {\n        position: 'absolute',\n        left: (this.VW / 2 - w / 2 + s.ox) + 'px',\n        top: (this.VH / 2 - h / 2 + s.oy) + 'px',\n        width: w + 'px', height: h + 'px',\n        maxWidth: 'none', pointerEvents: 'none', userSelect: 'none'\n      },\n      onPortraitFile: (e) => {\n        const file = e.target.files && e.target.files[0];\n        if (!file) return;\n        const reader = new FileReader();\n        reader.onload = () => {\n          const img = new Image();\n          img.onload = () => {\n            const max = 1400;\n            const sc = Math.min(1, max / Math.max(img.width, img.height));\n            const cv = document.createElement('canvas');\n            cv.width = Math.round(img.width * sc); cv.height = Math.round(img.height * sc);\n            cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);\n            const url = cv.toDataURL('image/jpeg', 0.85);\n            this.set({ portraitUrl: url, iw: cv.width, ih: cv.height, ox: 0, oy: 0, zoom: 1 });\n          };\n          img.src = reader.result;\n        };\n        reader.readAsDataURL(file);\n      },\n      removePortrait: () => this.set({ portraitUrl: null, iw: 0, ih: 0, ox: 0, oy: 0, zoom: 1 }),\n      onZoom: (e) => {\n        const zoom = parseFloat(e.target.value);\n        const [ox, oy] = this.clampOffsets(this.state.ox, this.state.oy, zoom);\n        this.set({ zoom, ox, oy });\n      },\n      cropDown: (e) => {\n        e.currentTarget.setPointerCapture(e.pointerId);\n        this._drag = { x: e.clientX, y: e.clientY, ox: this.state.ox, oy: this.state.oy };\n      },\n      cropMove: (e) => {\n        if (!this._drag) return;\n        const nox = this._drag.ox + (e.clientX - this._drag.x);\n        const noy = this._drag.oy + (e.clientY - this._drag.y);\n        const [ox, oy] = this.clampOffsets(nox, noy, this.state.zoom);\n        this.setState({ ox, oy });\n      },\n      cropUp: () => { if (this._drag) { this._drag = null; this.save(); } },\n      vertSwatches: mkSwatches('vert', ['#9bce64', '#60a050', '#3e7a6e', '#b3862e']),\n      jauneSwatches: mkSwatches('jaune', ['#e6d76c', '#e0b84f', '#d8d8d8', '#cfc4b0']),\n      rougeSwatches: mkSwatches('rouge', ['#984534', '#a04030', '#8e2e4c', '#c06a2e']),\n      cVert: s.colors.vert, cJaune: s.colors.jaune, cRouge: s.colors.rouge,\n      pickVert: (e) => this.pickColor('vert', e.target.value),\n      pickJaune: (e) => this.pickColor('jaune', e.target.value),\n      pickRouge: (e) => this.pickColor('rouge', e.target.value),\n      generate: () => this.generate(),\n      generateLabel: s.generating ? L.generating : L.generate,\n      showPreview: s.showPreview,\n      previewUrl: s.previewUrl,\n      closePreview: () => this.setState({ showPreview: false }),\n      downloadPdf: () => {\n        const { jsPDF } = window.jspdf;\n        const pdf = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });\n        pdf.addImage(s.previewUrl, 'JPEG', 0, 0, 297, 210);\n        const name = (s.f.nom || 'personnage').replace(/[^\\p{L}\\p{N} _-]/gu, '').trim() || 'personnage';\n        pdf.save('CQNR - ' + name + '.pdf');\n      }\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
